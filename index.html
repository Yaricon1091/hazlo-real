<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazlo Real — De la idea a la realidad</title>
  <meta name="description" content="Asesoría y acompañamiento para micro y pequeños emprendedores: marca, redes, web y finanzas.">
  <meta name="theme-color" content="#11294b">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#inicio" aria-label="Hazlo Real, inicio">
      <img id="logo" src="assets/logo.png" alt="" width="46" height="46">
      <span><b id="brand-name"></b><small id="brand-lema"></small></span>
    </a>
    <nav>
      <a href="#servicios">Servicios</a>
      <a href="#proceso">Cómo trabajamos</a>
      <a href="#dudas">Dudas</a>
      <a href="#contacto" class="btn small">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="inicio" class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="eyebrow" id="hero-tag"></p>
          <h1 id="hero-title"></h1>
          <p class="lead" id="hero-text"></p>
          <div class="actions left">
            <a class="btn" id="hero-cta" target="_blank" rel="noopener"></a>
            <a class="btn outline" id="hero-cta2" href="#servicios"></a>
          </div>
        </div>
        <img class="seal" src="assets/logo-completo.png" alt="Sello de Hazlo Real: asesoría y acompañamiento" width="420" height="420">
      </div>
    </section>

    <section class="trust"><div class="wrap grid three" id="promesas"></div></section>

    <section class="section">
      <div class="wrap">
        <h2 id="pq-title"></h2>
        <p class="sub" id="pq-text"></p>
        <ul class="chips" id="pq-list"></ul>
      </div>
    </section>

    <section id="servicios" class="section alt">
      <div class="wrap">
        <h2 id="serv-title"></h2>
        <p class="sub" id="serv-text"></p>
        <div class="grid" id="serv-grid"></div>
      </div>
    </section>

    <section id="proceso" class="section">
      <div class="wrap">
        <h2 id="pasos-title"></h2>
        <ol class="steps" id="pasos"></ol>
      </div>
    </section>

    <section id="testimonios" class="section alt" hidden>
      <div class="wrap">
        <h2 id="test-title"></h2>
        <div class="grid" id="test-grid"></div>
      </div>
    </section>

    <section id="dudas" class="section">
      <div class="wrap narrow">
        <h2 id="faq-title"></h2>
        <div id="faq"></div>
      </div>
    </section>

    <section id="contacto" class="contact">
      <div class="wrap">
        <h2 id="c-title"></h2>
        <p class="lead" id="c-text"></p>
        <div class="actions">
          <a class="btn light" id="c-wa" target="_blank" rel="noopener">Escribir por WhatsApp</a>
          <a class="btn ghost" id="c-mail"></a>
        </div>
        <p class="hours" id="c-hours"></p>
      </div>
    </section>
  </main>

  <footer><p id="foot"></p></footer>
  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">💬 <span>WhatsApp</span></a>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
